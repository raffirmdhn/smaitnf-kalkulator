<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List - Live Coding - Raffi</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Konten Utama -->
  <main class="main-content">
    <header class="header">
      <button type="button" class="btn-theme" onclick="gantiMode()">Ganti Mode</button>
      <h1>To-Do List</h1>
      <p class="subtitle">Belajar DOM Manipulation & Fetch Data dari API</p>
    </header>

    <!-- Form Input Tambah Tugas -->
    <section class="section-form">
      <form id="formTugas">
        <div class="form-group">
          <label for="inputTugas">Tugas Baru:</label>
          <div class="input-inline">
            <input type="text" id="inputTugas" placeholder="Contoh: Belajar JavaScript DOM" autocomplete="off">
            <button type="submit" id="btnTambah">Tambah</button>
          </div>
        </div>
      </form>
    </section>

    <hr>

    <!-- Daftar List Tugas -->
    <section class="section-list">
      <div class="list-header">
        <h2>Daftar Tugas</h2>
        <span id="badgeJumlah" class="badge">0 Tugas</span>
      </div>

      <!-- Container Tugas (Diisi oleh JavaScript) -->
      <ul id="daftarTugas" class="todo-list">
        <!-- Item tugas akan muncul di sini secara dinamis -->
      </ul>

      <!-- Pesan status (kosong / loading / error) -->
      <p id="pesan" class="empty-state">Belum ada tugas. Tambahkan tugas baru atau muat data dari API!</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
