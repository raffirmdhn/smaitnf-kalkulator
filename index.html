<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kalkulator Diskon Belanja</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Kalkulator Diskon Belanja</h1>

  <!-- Form Input -->
  <p>Harga Barang (Rp):</p>
  <input type="number" id="harga" placeholder="Contoh: 250000">

  <p>Diskon (%):</p>
  <input type="number" id="diskon" placeholder="Contoh: 10">

  <br><br>
  <button onclick="hitung()">Hitung Total</button>

  <hr>

  <!-- Tabel Rincian Hasil -->
  <h3>Rincian Pembayaran</h3>
  <table>
    <tr>
      <th>Keterangan</th>
      <th>Nilai</th>
    </tr>
    <tr>
      <td>Harga Asli</td>
      <td id="txtHarga">Rp 0</td>
    </tr>
    <tr>
      <td>Potongan Diskon</td>
      <td id="txtPotongan">Rp 0</td>
    </tr>
    <tr>
      <td><strong>Total Bayar</strong></td>
      <td><strong id="txtTotal">Rp 0</strong></td>
    </tr>
    <!-- Baris bonus (muncul jika belanja > 200rb) -->
    <tr id="barisBonus" class="bonus-row" style="display: none;">
      <td>🎁 Bonus Spesial</td>
      <td>Potongan Ekstra Rp 10.000 + Free Ongkir!</td>
    </tr>
  </table>

  <script src="script.js"></script>
</body>
</html>
